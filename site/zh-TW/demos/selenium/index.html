<html lang="zh-Hant">
  <head>

    <meta property="og:description" content="Selenium 官網首頁的整頁前後對照——原始網站，與以 Soft Syntax 重建的同一份內容。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://catwithlover.github.io/soft-syntax/zh-TW/demos/selenium/" />
    <link rel="canonical" href="https://catwithlover.github.io/soft-syntax/zh-TW/demos/selenium/" />
    <link rel="alternate" hreflang="en" href="https://catwithlover.github.io/soft-syntax/demos/selenium/" />
    <link rel="alternate" hreflang="zh-Hant" href="https://catwithlover.github.io/soft-syntax/zh-TW/demos/selenium/" />
    <link rel="alternate" hreflang="x-default" href="https://catwithlover.github.io/soft-syntax/demos/selenium/" />
    <title>Selenium 改造示範 — Soft Syntax</title>
    <link rel="icon" href="../../../assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../../../styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳至主要內容</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="../../../#top" aria-label="Soft Syntax 首頁">
          <img src="../../../assets/logo.svg" alt="" width="40" height="40" />
          <span class="brand-name">Soft Syntax</span>
        </a>

        <div class="header-actions">
          <a class="language-link" href="../../../demos/selenium/" lang="en" hreflang="en">English</a>

          <a
            class="github-link"
            href="https://github.com/catwithlover/soft-syntax"
            aria-label="View Soft Syntax on GitHub"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.87c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.64-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.6 9.6 0 0 1 12 6.82a9.6 9.6 0 0 1 2.5.34c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.86v2.76c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"
              />
            </svg>
            <span class="github-label">GitHub</span>
          </a>
        </div>
      </div>
    </header>

    <main id="main-content" class="demo-main">
      <div class="page-shell">
        <div class="demo-intro">
          <p class="eyebrow">改造示範</p>
          <h1>Selenium</h1>
          <p class="demo-target-line">
            Selenium 官網首頁的整頁前後對照——原始網站，與以 Soft Syntax 重建的同一份內容。 <a href="https://www.selenium.dev/">selenium.dev</a>
          </p>
          <p class="demo-target-line">
            <a class="demo-notes-link" href="https://github.com/catwithlover/soft-syntax/blob/main/demos/selenium/notes.md">設計筆記（GitHub）<span aria-hidden="true">↗</span></a>
            <span aria-hidden="true">·</span>
            <a class="demo-notes-link" href="../../../#demos">← 所有示範</a>
          </p>
        </div>

        <section class="compare" aria-labelledby="selenium-desktop-heading">
          <input class="compare-view compare-view-after" type="radio" name="selenium-desktop" id="selenium-d-after" checked />
          <input class="compare-view compare-view-before" type="radio" name="selenium-desktop" id="selenium-d-before" />
          <div class="compare-head">
            <h2 id="selenium-desktop-heading">桌機版本</h2>
            <div class="compare-toggle">
              <label class="compare-label compare-label-after" for="selenium-d-after"><span>改後</span></label>
              <label class="compare-label compare-label-before" for="selenium-d-before"><span>改前</span></label>
            </div>
          </div>
          <figure class="compare-stage">
            <img
              class="compare-img-after"
              src="../../../demo-assets/selenium/desktop-after.png"
              alt="Selenium以 Soft Syntax 改造後的整頁截圖"
              width="1425"
              height="2932"
              loading="lazy"
              decoding="async"
            />
            <img
              class="compare-img-before"
              src="../../../demo-assets/selenium/desktop-before.png"
              alt="Selenium原始網站的整頁截圖"
              width="1425"
              height="2938"
              loading="lazy"
              decoding="async"
            />
            <figcaption>整頁截圖 · 視窗 1440 × 900、device scale 1。前後使用相同設定。</figcaption>
          </figure>
        </section>

        <section class="compare" aria-labelledby="selenium-mobile-heading">
          <input class="compare-view compare-view-after" type="radio" name="selenium-mobile" id="selenium-m-after" checked />
          <input class="compare-view compare-view-before" type="radio" name="selenium-mobile" id="selenium-m-before" />
          <div class="compare-head">
            <h2 id="selenium-mobile-heading">手機版本</h2>
            <div class="compare-toggle">
              <label class="compare-label compare-label-after" for="selenium-m-after"><span>改後</span></label>
              <label class="compare-label compare-label-before" for="selenium-m-before"><span>改前</span></label>
            </div>
          </div>
          <figure class="compare-stage compare-stage-mobile">
            <img
              class="compare-img-after"
              src="../../../demo-assets/selenium/mobile-after.png"
              alt="Selenium以 Soft Syntax 改造後的手機版整頁截圖"
              width="780"
              height="9556"
              loading="lazy"
              decoding="async"
            />
            <img
              class="compare-img-before"
              src="../../../demo-assets/selenium/mobile-before.png"
              alt="Selenium原始網站的手機版整頁截圖"
              width="780"
              height="10144"
              loading="lazy"
              decoding="async"
            />
            <figcaption>整頁截圖 · 視窗 390 × 844、device scale 2。可於框內捲動瀏覽。</figcaption>
          </figure>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="page-shell footer-layout">
        <div class="footer-brand">
          <img src="../../../assets/logo.svg" alt="" width="44" height="44" />
          <div>
            <strong>Soft Syntax</strong>
            <p>給數位產品更溫柔的文法。</p>
          </div>
        </div>
        <div class="footer-meta">
          <p class="footer-note">開源，獻給需要體貼介面的工作。</p>
          <p class="footer-links">
            <a href="../../../LICENSE.txt">MIT 授權</a>
            <a href="../../../licenses/fonts/THIRD_PARTY_NOTICES.md">字型授權</a>
          </p>
        </div>
      </div>
    </footer>
  </body>
</html>
