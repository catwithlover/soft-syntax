name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "LICENSE"
      - "skills/soft-syntax/assets/fonts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare website artifact
        run: |
          mkdir -p _site/licenses/fonts/quicksand _site/licenses/fonts/huninn
          cp -R site/. _site/
          cp LICENSE _site/LICENSE.txt
          cp skills/soft-syntax/assets/fonts/THIRD_PARTY_NOTICES.md _site/licenses/fonts/THIRD_PARTY_NOTICES.md
          cp skills/soft-syntax/assets/fonts/quicksand/OFL.txt _site/licenses/fonts/quicksand/OFL.txt
          cp skills/soft-syntax/assets/fonts/huninn/LICENSE.txt _site/licenses/fonts/huninn/LICENSE.txt
          cp skills/soft-syntax/assets/fonts/huninn/APACHE-2.0.txt _site/licenses/fonts/huninn/APACHE-2.0.txt

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
